parse_config:
  zmk_additional_includes:
    - "modules/zmk/helpers/include"

  zmk_preamble: |
    #include <zmk-helpers/key-labels/34.h>
    #define CONFIG_WIRELESS

  raw_binding_map:
    "&bootloader": Boot
    "&leader": Leader
    "&smart_mouse": Mouse

    "&bt BT_SEL 0": BT 1
    "&bt BT_SEL 1": BT 2
    "&bt BT_SEL 2": BT 3
    "&bt BT_SEL 3": BT 4

    # home row mods: modifier on the right side of the key
    "&hml LCTRL A": {t: A, h: Ctrl}
    "&hml LALT S": {t: S, h: Alt}
    "&hml LGUI D": {t: D, h: Gui}
    "&hml LSHFT F": {t: F, h: $$mdi:apple-keyboard-shift$$}

    "&hmr RSHFT J": {t: J, h: $$mdi:apple-keyboard-shift$$}
    "&hmr RGUI K": {t: K, h: Gui}
    "&hmr RALT L": {t: L, h: Alt}
    "&hmr RCTRL SEMI": {t: ";", h: Ctrl}

    "&mmv MOVE_UP": $$tabler:arrow-up$$
    "&mmv MOVE_DOWN": $$tabler:arrow-down$$
    "&mmv MOVE_LEFT": $$tabler:arrow-left$$
    "&mmv MOVE_RIGHT": $$tabler:arrow-right$$

    "&msc SCRL_UP": $$mdi:arrow-collapse-up$$
    "&msc SCRL_DOWN": $$mdi:arrow-collapse-down$$
    "&msc SCRL_LEFT": $$mdi:arrow-collapse-left$$
    "&msc SCRL_RIGHT": $$mdi:arrow-collapse-right$$

    "&mkp LCLK": $$mdi:mouse-left-click$$
    "&mkp RCLK": $$mdi:mouse-right-click$$

  trans_legend: { "t": "", "type": "trans" }

  zmk_combos:
    mouse: { align: bottom, o: 0.15 }
    ldr: { align: top, o: 1.35 }

    # combo_lt: { hidden: true }
    # combo_gt: { hidden: true }
    # combo_lbrc: { hidden: true }
    # combo_rbrc: { hidden: true }

  zmk_keycode_map:
    # custom mappings
    LALT: Alt
    RALT: Alt
    LCTRL: Ctrl
    RCTRL: Ctrl
    LGUI: Gui
    RGUI: Gui
    LSHFT: Shift
    RSHFT: Shift
    
    KP_NUM: NUM
    KP 1: { t: "1", h: KP}
    KP 2: { t: "2", h: KP}

    BSPC: $$mdi:backspace-outline$$
    DEL: Del
    ESC: Esc
    RET: $$mdi:keyboard-return$$
    SPACE: Spc
    TAB: Tab

    PG_UP: PgUp
    PG_DN: PgDn
    INS: Ins
    HOME: Home
    END: End

    UP: ↑
    DOWN: ↓
    LEFT: ←
    RIGHT: →

    K_CANCEL: Cancel

    # numpad
    KP_NUM: Num
    KP_PLUS: "+"
    KP_MINUS: "-"
    KP_MULTIPLY: "*"
    KP_DIVIDE: "/"
    KP_DOT: "."
    KP_EQUAL: "="
    KP_N0: "0"
    KP_N1: "1"
    KP_N2: "2"
    KP_N3: "3"
    KP_N4: "4"
    KP_N5: "5"
    KP_N6: "6"
    KP_N7: "7"
    KP_N8: "8"
    KP_N9: "9"

    C_MUTE: $$mdi:volume-off$$
    C_PP: $$mdi:play-pause$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-medium$$

    # defaults
    AMPERSAND: "&"
    AMPS: "&"
    APOS: "'"
    APOSTROPHE: "'"
    ASTERISK: "*"
    ASTRK: "*"
    AT: "@"
    AT_SIGN: "@"
    BACKSLASH: \
    BSLH: \
    CARET: ^
    COLON: ":"
    COMMA: ","
    DLLR: $
    DOLLAR: $
    DOT: .
    DOUBLE_QUOTES: '"'
    DQT: '"'
    EQUAL: "="
    EXCL: "!"
    EXCLAMATION: "!"
    FSLH: /
    GRAVE: "`"
    GREATER_THAN: ">"
    GT: ">"
    HASH: "#"
    LBKT: "["
    LBRC: "{"
    LEFT_BRACE: "{"
    LEFT_BRACKET: "["
    LEFT_PARENTHESIS: (
    LESS_THAN: <
    LPAR: (
    LT: <
    MINUS: "-"
    NON_US_BACKSLASH: \
    NON_US_BSLH: "|"
    NON_US_HASH: "#"
    NUHS: "#"
    PERCENT: "%"
    PERIOD: .
    PIPE: "|"
    PIPE2: "|"
    PLUS: +
    POUND: "#"
    PRCNT: "%"
    QMARK: "?"
    QUESTION: "?"
    RBKT: "]"
    RBRC: "}"
    RIGHT_BRACE: "}"
    RIGHT_BRACKET: "]"
    RIGHT_PARENTHESIS: )
    RPAR: )
    SEMI: ;
    SEMICOLON: ;
    SINGLE_QUOTE: "'"
    SLASH: /
    SQT: "'"
    STAR: "*"
    TILDE: "~"
    TILDE2: "~"
    UNDER: _
    UNDERSCORE: _

draw_config:
  append_colon_to_layer_header: false
  dark_mode: false
  footer_text: "ms/zmk-config"
  glyph_tap_size: 15
  glyph_hold_size: 12
  glyph_shifted_size: 9
  legend_rel_y: 1
  outer_pad_w: 10
  outer_pad_h: 10
  small_pad: 4

